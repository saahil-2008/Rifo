services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rifo-db
    environment:
      POSTGRES_USER: rifo
      POSTGRES_PASSWORD: rifo_dev_password
      POSTGRES_DB: rifo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rifo"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
